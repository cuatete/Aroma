<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aroma Luxuri — Catálogo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="intro">
  <div class="brand">AROMA LUXURI</div>
  <div class="sub">PERFUMES DE LUJO</div>
</div>

<header>
  <div class="logo">AROMA LUXURI</div>
</header>

<section id="page-catalogo" class="page active">
  <div class="hero">
    <h1>NUESTRA <span>COLECCIÓN</span></h1>
    <p>FRAGANCIAS EXCLUSIVAS · EDICIÓN LIMITADA</p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="page-detalle" class="page">
  <div class="detail-wrap">
    <div class="detail-img">
      <img id="d-img" src="" alt="">
    </div>
    <div class="detail-info">
      <h2 id="d-nombre">—</h2>
      <span class="tag" id="d-tag">EAU DE PARFUM</span>
      <p class="desc" id="d-desc">—</p>

      <div class="notes" id="d-notas"></div>

      <div class="ml-label">SELECCIONA LA PRESENTACIÓN</div>
      <div class="ml-options" id="d-ml"></div>

      <div class="price-box">
        <div class="p-label">PRECIO</div>
        <div class="p-value" id="d-precio">$0.00</div>
      </div>

      <button class="btn-back" onclick="volverAlCatalogo()">← VOLVER AL INICIO</button>
    </div>
  </div>
</section>

<footer>© 2025 AROMA LUXURI — TODOS LOS DERECHOS RESERVADOS</footer>

<script src="script.js"></script>
</body>
</html>
